services:
  jenkins:
    user: jenkins
    container_name: jenkins
    build:
      context: ./jenkins
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        # - linux/arm64
    ports:
      - 127.0.0.1:8080:8080
      - 127.0.0.1:50000:50000
    restart: always
    environment:
      CASC_JENKINS_CONFIG: /jenkins.yaml
      DOCKER_HOST: tcp://socket-proxy:2375
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/jenkins-iac/jenkins.yaml:/jenkins.yaml:ro
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    environment:
      - ALLOW_START=1 #optional
      - ALLOW_STOP=1 #optional
      - ALLOW_RESTARTS=1 #optional
      - AUTH=0 #optional
      - BUILD=0 #optional
      - COMMIT=0 #optional
      - CONFIGS=0 #optional
      - CONTAINERS=1 #optional
      - DISABLE_IPV6=0 #optional
      - DISTRIBUTION=0 #optional
      - EVENTS=1 #optional
      - EXEC=1 #optional
      - IMAGES=1 #optional
      - INFO=0 #optional
      - LOG_LEVEL=info #optional
      - NETWORKS=0 #optional
      - NODES=0 #optional
      - PING=1 #optional
      - PLUGINS=0 #optional
      - POST=1 #optional
      - SECRETS=0 #optional
      - SERVICES=0 #optional
      - SESSION=0 #optional
      - SWARM=0 #optional
      - SYSTEM=0 #optional
      - TASKS=0 #optional
      - TZ=Etc/UTC #optional
      - VERSION=1 #optional
      - VOLUMES=0 #optional
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
